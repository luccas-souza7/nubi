  <body>
    <header class="top">
      <div class="in">
        <a class="brand" href="./"><img src="assets/favicon.png" alt="" /><span>Nubi</span></a>
        <nav><a href="novidades.html" aria-current="page">Novidades</a><a href="privacidade.html">Privacidade</a><a href="termos.html">Termos</a></nav>
      </div>
    </header>
    <main>
      <h1>Novidades do Nubi</h1>
      <p class="muted">O que mudou em cada versão. Quem usa o instalador recebe as atualizações sozinho; na versão portátil, o Nubi avisa e mostra o link.</p>
      <div id="list"><p class="muted">Carregando…</p></div>
    </main>
    <footer><div class="in"><span>Nubi · ícones <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> (licença ISC)</span><a href="privacidade.html">Política de privacidade</a><a href="termos.html">Termos de uso</a></div></footer>
    <script>
      ;(function () {
        var cfg = window.NUBI_CONFIG || {}
        var repo = cfg.repoReleases || 'luccas-souza7/nubi'
        var list = document.getElementById('list')
        function el(tag, cls, text) {
          var e = document.createElement(tag)
          if (cls) e.className = cls
          if (text != null) e.textContent = text
          return e
        }
        // As notas vêm em Markdown simples: mostramos como texto, nunca como HTML.
        // Apaga qualquer código (HTML) que venha nas notas: o cliente só vê texto.
        function clean(md) {
          return String(md || '')
            .replace(/\r/g, '')
            .replace(/<[^>]*>?/g, '')
            .replace(/&(amp|lt|gt|quot|#39|nbsp);/g, function (_, e) {
              return { amp: '&', lt: '', gt: '', quot: '"', '#39': "'", nbsp: ' ' }[e]
            })
            .replace(/^\s*[-*]\s+/gm, '• ')
            .replace(/\*\*(.+?)\*\*/g, '$1')
            .replace(/^#+\s*/gm, '')
            .split('\n')
            .map(function (l) { return l.trim() })
            .filter(function (l, i, all) { return l || (i > 0 && all[i - 1]) })
            .join('\n')
            .trim()
        }
        fetch('https://api.github.com/repos/' + repo + '/releases?per_page=20', { headers: { Accept: 'application/vnd.github+json' } })
          .then(function (r) {
            if (!r.ok) throw new Error(r.status)
            return r.json()
          })
          .then(function (releases) {
            releases = releases.filter(function (r) { return !r.draft && !r.prerelease })
            list.innerHTML = ''
            if (!releases.length) {
              list.appendChild(el('p', 'muted', 'Ainda não há versões publicadas.'))
              return
            }
            releases.forEach(function (r, i) {
              var box = el('article', 'release')
              var head = el('header')
              head.appendChild(el('h2', null, 'Versão ' + String(r.tag_name || r.name).replace(/^v/, '')))
              if (i === 0) head.appendChild(el('span', 'badge', 'mais recente'))
              head.appendChild(el('span', 'date', new Date(r.published_at).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' })))
              box.appendChild(head)
              box.appendChild(el('p', 'notes', clean(r.body) || 'Melhorias e correções.'))
              if (i === 0) {
                var a = el('a', 'btn', 'Baixar a versão portátil mais nova')
                a.href = 'https://github.com/' + repo + '/releases/latest/download/Nubi-Portable.exe'
                box.appendChild(a)
              }
              list.appendChild(box)
            })
          })
          .catch(function () {
            list.innerHTML = ''
            list.appendChild(el('p', 'muted', 'Não consegui carregar as novidades agora. Tente de novo daqui a pouco.'))
          })
      })()
    </script>
  </body>
</html>
