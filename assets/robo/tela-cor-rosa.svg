<svg class="bot bot-feliz" viewBox="0 0 120 120" width="240" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lumi, o robozinho"><style> .bot .bot-eyes{transform-box:fill-box;transform-origin:center} .bot.bot-neutro .bot-eyes,.bot.bot-ouvindo .bot-eyes,.bot.bot-falando .bot-eyes{animation:bot-blink 4.2s infinite} .bot .bot-talk{transform-box:fill-box;transform-origin:center;animation:bot-talk .26s ease-in-out infinite alternate} .bot .bot-float{animation:bot-float 3.2s ease-in-out infinite} .bot .bot-shadow{transform-box:fill-box;transform-origin:center;animation:bot-shadow 3.2s ease-in-out infinite} .bot .bot-bob{animation:bot-bob 4s ease-in-out infinite} .bot .bot-beacon{transform-box:fill-box;transform-origin:center;animation:bot-beacon 2.2s ease-in-out infinite} .bot.bot-pensando .bot-beacon,.bot.bot-ouvindo .bot-beacon{animation-duration:.8s} @keyframes bot-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}} @keyframes bot-talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}} @keyframes bot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} @keyframes bot-shadow{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.82);opacity:.18}} @keyframes bot-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}} @keyframes bot-beacon{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}} @media (prefers-reduced-motion:reduce){.bot *{animation:none!important}} </style><defs><filter id="t-c-rosa-led" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="t-c-rosa-case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDFDFF"/><stop offset="1" stop-color="#C9CFDF"/></linearGradient><linearGradient id="t-c-rosa-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C2240"/><stop offset="1" stop-color="#090C18"/></linearGradient></defs><g class="bot-bob"><ellipse cx="60" cy="109" rx="25" ry="6" fill="#000" opacity=".25"/><rect x="52" y="86" width="16" height="12" rx="3" fill="#AEB6CB"/><path d="M36 108 Q36 97 60 97 Q84 97 84 108 Z" fill="url(#t-c-rosa-case)"/><rect x="54" y="101" width="12" height="3" rx="1.5" fill="#FF8FC7" filter="url(#t-c-rosa-led)"/><rect x="9" y="42" width="12" height="26" rx="6" fill="#B9C1D6"/><rect x="99" y="42" width="12" height="26" rx="6" fill="#B9C1D6"/><rect x="13" y="50" width="4" height="10" rx="2" fill="#FF8FC7" opacity=".85"/><rect x="103" y="50" width="4" height="10" rx="2" fill="#FF8FC7" opacity=".85"/><rect x="17" y="22" width="86" height="66" rx="22" fill="url(#t-c-rosa-case)"/><rect x="25" y="30" width="70" height="50" rx="15" fill="url(#t-c-rosa-screen)"/><path d="M32 37 Q40 33 52 33" stroke="#fff" stroke-opacity=".16" stroke-width="3" stroke-linecap="round" fill="none"/><g filter="url(#t-c-rosa-led)"><g class="bot-eyes"><path d="M41.5 54.2 Q47 45.4 52.5 54.2" stroke="#FF8FC7" stroke-width="3.5200000000000005" stroke-linecap="round" fill="none"/><path d="M67.5 54.2 Q73 45.4 78.5 54.2" stroke="#FF8FC7" stroke-width="3.5200000000000005" stroke-linecap="round" fill="none"/></g><path d="M52.3 63.8 Q60 71.5 67.7 63.8" stroke="#FF8FC7" stroke-width="3.3000000000000003" stroke-linecap="round" fill="none"/></g><ellipse cx="34" cy="70" rx="4.5" ry="2.4" fill="#FF8FB4" opacity=".45"/><ellipse cx="86" cy="70" rx="4.5" ry="2.4" fill="#FF8FB4" opacity=".45"/></g></svg>